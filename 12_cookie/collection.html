<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Cookie and collections</title>
</head>
<body>
    <form class="w-25 m-auto mb-5 mt-2" onsubmit="addBookHandle(event)">
        <div class="input-group flex-column">
            <label class="form-label">Назва</label>
            <input name="title" class="form-text">
        </div>
        <div class="input-group flex-column">
            <label class="form-label">Автор</label>
            <input name="author" class="form-text">
        </div>
        <div>
            <button type="submit" class="btn btn-success w-100 mt-3">Додати</button>
        </div>
    </form>

    <table class="table table-striped w-25 m-auto">
        <thead>
            <tr>
                <th>Назва</th>
                <th>Автор</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>

    <script src="collection.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
