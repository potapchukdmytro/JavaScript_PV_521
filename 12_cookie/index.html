<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        />
        <title>12_Cookie</title>
    </head>
    <body>
        <form onsubmit="formSetCookie(event)" class="w-25 m-auto p-3 border border-2 border-black bor mt-3">
            <div class="input-group d-flex flex-column">
                <label class="form-label">Ключ</label>
                <input name="key" type="text" class="form-text" />
            </div>
            <div class="input-group d-flex flex-column mt-4">
                <label class="form-label">Значення</label>
                <input name="value" type="text" class="form-text" />
            </div>
            <div class="input-group d-flex flex-column mt-4">
                <label class="form-label">Дата</label>
                <input name="expires" type="datetime-local" class="form-text" />
            </div>
            <div>
                <button type="submit" class="btn btn-primary w-100 mt-4">Додати</button>
            </div>
        </form>

        <script src="script.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
