<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        />
        <title>Реєстрація</title>
    </head>
    <body>
        <div id="navbar"></div>

        <h1 class="text-center mt-4">Реєстрація</h1>
        <form class="w-25 m-auto" onsubmit="registerSubmit(event)">
            <div>
                <label for="name" class="form-label mt-4"
                    >Ім'я</label
                >
                <input
                    type="text"
                    class="form-control"
                    id="name"
                    name="name"
                    placeholder="John Doe"
                />
            </div>

            <div>
                <label for="email" class="form-label mt-4"
                    >Електронна пошта</label
                >
                <input
                    type="text"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="example@mail.com"
                />
            </div>

            <div>
                <label for="password" class="form-label mt-4">Пароль</label>
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                />
            </div>

            <div>
                <input
                    type="submit"
                    value="Зареєструватися"
                    class="btn btn-secondary w-100 mt-4"
                />
            </div>
        </form>
        <script src="../script.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
